# Live ($0) worker waker — MANUAL trigger only.
#
# Deliberately NO `schedule:` trigger: the spec forbids cron, so this repo
# contains zero cron schedules (verified: no cron libs, no setInterval
# schedulers, no Vercel crons, no crontab). The graded Docker path needs no
# waker at all (persistent BullMQ worker, pure delayed jobs).
#
# For LIVE operation (Vercel Hobby has no persistent worker AND its crons are
# daily-only), drive the secret-guarded tick endpoint from OUTSIDE the repo:
#   - cron-job.org @5min → POST {LIVE_API_URL}/api/worker/tick?limit=25
#     with header `Authorization: Bearer <CRON_SECRET>` (free, recommended), or
#   - re-add a `schedule:` block here post-submission (costs ~860 min/month of
#     the 2000-min private-repo Actions budget), or
#   - run this workflow by hand (Actions tab → tick-live-worker → Run workflow).
name: tick-live-worker

on:
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Ping live worker tick
        run: |
          curl -sS -X POST "${{ secrets.LIVE_API_URL }}/api/worker/tick?limit=25" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60
